name: quizforge-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: quizforge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizforge}
      POSTGRES_USER: ${POSTGRES_USER:-quizforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizforge123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizforge} -d ${POSTGRES_DB:-quizforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizforge-network

  backend:
    build:
      context: ./quizforge-srv
      dockerfile: Dockerfile
    container_name: quizforge-srv
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quizforge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quizforge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quizforge123}
      JWT_SECRET: ${JWT_SECRET:-quizforge-secret-key-please-change-in-production-2026}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - quizforge-network

  frontend:
    build:
      context: ./quizforge-fed
      dockerfile: Dockerfile
    container_name: quizforge-fed
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quizforge-network

volumes:
  postgres-data:

networks:
  quizforge-network:
    driver: bridge