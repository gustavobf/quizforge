spring:
  profiles:
    default: dev
  docker:
    compose:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          lob:
            non_contextual_creation: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never
      platform: postgresql

jwt:
  secret: ${JWT_SECRET:quizforge-secret-key-please-change-in-production-2026}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000